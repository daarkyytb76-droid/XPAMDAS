<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pomnub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      position: fixed;
      top: 0;
      left: 0;
    }
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      display: none;
      pointer-events: none;
    }
    .bg.visible {
      display: block;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
    .overlay.hidden {
      display: none;
    }
    .play-btn {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      background: #ff9900;
      border: none;
      padding: 20px 48px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(255, 153, 0, 0.4);
      transition: background 0.2s, transform 0.15s;
    }
    .play-btn:hover {
      background: #ffaa22;
      transform: scale(1.05);
    }
    .play-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <img class="bg" id="bg" src="1000321982.jpg" alt="">
  <audio id="audio" src="audio_max_volume.m4a" loop preload="auto"></audio>

  <div class="overlay" id="overlay">
    <button class="play-btn" id="playBtn">Continuer</button>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const overlay = document.getElementById('overlay');
    const bg = document.getElementById('bg');
    const playBtn = document.getElementById('playBtn');

    function start() {
      // Volume max
      audio.volume = 1.0;
      audio.muted = false;

      // Affiche l'image
      bg.classList.add('visible');

      // Lance le son en boucle
      audio.play().catch(() => {});

      // Cache le bouton
      overlay.classList.add('hidden');

      // Tente le plein écran
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }

    playBtn.addEventListener('click', start);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) start();
    });
  </script>
</body>
</html>
